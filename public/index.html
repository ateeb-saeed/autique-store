<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autique — Car Care</title>
<meta name="description" content="Autique: premium car care from Gladiator, Sogo, Prato and WTB. Cash on delivery across Pakistan.">
<meta name="theme-color" content="#0f1b2b">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <div class="topstrip">
    <div class="announce" id="announce">Cash on delivery available across Pakistan</div>
    <header class="nav">
      <div class="container nav-in">
        <div class="nav-side">
          <button class="icon-btn" data-act="menu" aria-label="Open menu" aria-controls="drawer" aria-expanded="false">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <button class="icon-btn" data-act="search" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
        </div>
        <a class="logo" href="#/" aria-label="Autique home"><span class="nav-wordmark split-logo scroll-logo" aria-hidden="true"><span>aut</span><span class="al-grow al-mid"><span>o-bout</span></span><span>ique</span><span class="al-grow al-dot"><span>.</span></span></span></a>
        <div class="nav-side right">
          <a class="icon-btn" href="#/account" aria-label="Account" id="acct-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></a>
          <a class="icon-btn" href="#/cart" aria-label="Shopping bag"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg><span class="badge-count" id="cart-count" hidden>0</span></a>
        </div>
      </div>
    </header>
  </div>
  <div class="searchbar" id="searchbar">
    <div class="container">
      <form data-form="search"><input id="search-input" type="search" placeholder="Search tyre gel, wax, cleaners..." aria-label="Search"><button class="btn btn-primary" type="submit">Search</button></form>
    </div>
  </div>

  <div class="drawer-bg" id="drawer-bg" data-act="menu-close"></div>
  <aside class="drawer" id="drawer" aria-label="Menu" aria-hidden="true">
    <div class="drawer-head">
      <span class="drawer-title">Menu</span>
      <button class="icon-btn" data-act="menu-close" aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <nav class="drawer-links" id="drawer-links"></nav>
  </aside>

  <main id="app"><div class="spinner" aria-label="Loading"></div></main>
  <footer id="footer"></footer>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  <script src="app.js?v=11"></script>
</body>
</html>
